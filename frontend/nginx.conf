
# NovaCart frontend Nginx
#
# Public AWS ALB routing:
#   /api/*        -> backend Service :3001 (direct)
#   /socket.io/*  -> backend Service :3001 (direct)
#   /*            -> frontend Service :8080
#
# These Nginx proxy routes remain available for local/internal
# port-forward testing and same-origin access.
#
# Do not blindly trust incoming X-Forwarded-* headers.

# WebSocket upgrade and HTTP polling fallback
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Upload and JSON payload limit
    client_max_body_size 12m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------
    # Backend API - local/internal reverse proxy
    # ------------------------------------------
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Do not pass an untrusted client-supplied IP chain.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Reflect the actual Nginx connection scheme.
        # Public ALB API requests bypass this location.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_buffering off;
    }

    # ------------------------------------------
    # Socket.IO - local/internal reverse proxy
    # ------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        # WebSocket upgrade and polling compatibility
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket and polling connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # ------------------------------------------
    # React Router SPA fallback
    # ------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------
    # Prevent caching HTML entry
    # ------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ------------------------------------------
    # PWA service worker
    # ------------------------------------------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------
    # PWA manifests
    # ------------------------------------------
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------
    # Vite fingerprinted static assets
    # ------------------------------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
