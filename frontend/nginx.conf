
# This file is included from `conf.d/`, i.e. inside the `http {}` block, so a
# top-level `map` is valid here. It is what makes ONE location block serve both
# transports: a WebSocket upgrade gets `Connection: upgrade`, while the polling
# fallback (plain HTTP long-poll) gets `Connection: close`. Hard-coding
# `Connection "upgrade"` on a polling request is malformed and some proxies
# reject it — which is exactly how "WebSocket works locally, falls back to
# nothing in Docker" happens.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Product/category images are uploaded as multipart by the admin panel and
    # the API accepts up to 10 MB of JSON. Nginx's 1 MB default would reject
    # those bodies with a 413 that never reaches the application.
    client_max_body_size 12m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # Backend API reverse proxy
    # ==========================================
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_buffering off;
    }

    # ==========================================
    # Socket.IO (WebSocket + polling fallback)
    # ==========================================
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections: the engine's ping interval (25 s) keeps the
        # proxy from treating an idle socket as dead.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # ==========================================
    # React Router SPA fallback
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # Prevent caching HTML entry
    # ==========================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==========================================
    # PWA service worker
    # ==========================================
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # ==========================================
    # PWA manifests
    # ==========================================
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # ==========================================
    # Vite fingerprinted static assets
    # ==========================================
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
