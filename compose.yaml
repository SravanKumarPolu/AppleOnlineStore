
name: novacart

services:
  backend:
    image: novacart-backend:v2
    env_file:
      - ./backend/.env
    environment:
      # Browser origins served by THIS compose file. The HTTP CORS policy and
      # the Socket.IO handshake allow-list share this list (no wildcard: a
      # wildcard cannot be combined with credentialed requests, and it would
      # let any site drive the API). When the storefront/admin are served
      # same-origin through their own nginx, /api and /socket.io are proxied and
      # CORS is not involved at all.
      CORS_EXTRA_ORIGINS: "http://localhost:8080,http://localhost:8081"
    ports:
      - "3001:3001"
    restart: unless-stopped
    # Graceful shutdown must finish before Docker escalates to SIGKILL. The app
    # bounds its own drain (SHUTDOWN_TIMEOUT_MS, default 10 s) and closes the
    # HTTP server, sockets and MongoDB in order; 30 s leaves headroom for a slow
    # Mongo close so in-flight inventory writes are not cut off.
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - novacart-network

  frontend:
    image: novacart-frontend:v2
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Start only once the API answers /health/ready, so the reverse proxy never
    # serves a page whose /api or /socket.io upstream is still booting.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - "http://127.0.0.1:8080/"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - novacart-network

  admin:
    image: novacart-admin:v1
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - "http://127.0.0.1:8080/"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - novacart-network

networks:
  novacart-network:
    driver: bridge
