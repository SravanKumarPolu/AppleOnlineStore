
name: novacart

services:
  # Backend - Node.js + Express + Socket.IO
  backend:
    image: novacart-backend:v2

    env_file:
      - ./backend/.env

    environment:
      CORS_EXTRA_ORIGINS: "http://localhost:8080,http://localhost:8081"

    ports:
      - "127.0.0.1:3001:3001"

    restart: unless-stopped
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - novacart-network

  # Customer storefront - React + Nginx
  frontend:
    image: novacart-frontend:v3

    ports:
      - "127.0.0.1:8080:8080"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - "http://127.0.0.1:8080/"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - novacart-network

  # Admin dashboard - React + Nginx
  admin:
    image: novacart-admin:v2

    ports:
      - "127.0.0.1:8081:8080"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - "http://127.0.0.1:8080/"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - novacart-network

networks:
  novacart-network:
    driver: bridge
