name: NovaCart AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::942875993314:role/novacart-github-deploy
          aws-region: us-east-1
          allowed-account-ids: '942875993314'

      - name: Verify AWS identity
        run: aws sts get-caller-identity
