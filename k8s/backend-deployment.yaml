
apiVersion: apps/v1
kind: Deployment

metadata:
  name: novacart-backend
  namespace: novacart

spec:
  replicas: 1

  selector:
    matchLabels:
      app: novacart-backend

  template:
    metadata:
      labels:
        app: novacart-backend

    spec:
      containers:
        - name: backend
          image: novacart-backend:v3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          envFrom:
            - secretRef:
                name: novacart-backend-env

          startupProbe:
            httpGet:
              path: /health/live
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
