
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: novacart
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app: novacart-backend
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
