apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacart-admin
  namespace: novacart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novacart-admin
  template:
    metadata:
      labels:
        app: novacart-admin
    spec:
      automountServiceAccountToken: false
      containers:
        - name: admin
          image: 942875993314.dkr.ecr.us-east-1.amazonaws.com/novacart/admin:dashboard-auth-6f964de
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              ephemeral-storage: "64Mi"
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
