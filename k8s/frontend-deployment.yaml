
apiVersion: apps/v1
kind: Deployment

metadata:
  name: novacart-frontend
  namespace: novacart

spec:
  replicas: 1

  selector:
    matchLabels:
      app: novacart-frontend

  template:
    metadata:
      labels:
        app: novacart-frontend

    spec:
      containers:
        - name: frontend
          image: novacart-frontend:v3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
