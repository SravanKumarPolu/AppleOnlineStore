
apiVersion: v1
kind: ConfigMap

metadata:
  name: novacart-backend-config
  namespace: novacart

data:
  PORT: "3001"
  NODE_ENV: "development"

  CORS_EXTRA_ORIGINS: "http://localhost:8080,http://localhost:8081,http://shop.novacart.localhost:8090,http://admin.novacart.localhost:8090"

  PAYPAL_ENV: "sandbox"

  # Multi-replica Socket.IO Redis adapter
  REDIS_URL: "redis://novacart-redis.novacart.svc.cluster.local:6379"

  # Redis must be available for backend startup
  SOCKETIO_REDIS_REQUIRED: "true"

  # WebSocket-only transport for local multi-replica testing
  SOCKETIO_TRANSPORTS: "websocket"
